<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="hitslop-renderer" content="sql-html-v1">
  <title>Recipe Card</title>
  <style>
    :root{color-scheme:dark;--bg:#1c0d14;--panel:#2a111e;--ink:#fff3f7;--muted:#bf8298;--accent:#f45f93;--line:#583044}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
    body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:radial-gradient(580px 380px at 100% 0,#421626 0,transparent 62%),var(--bg)}
    main{padding:30px 24px 34px}
    h1,input,textarea{font:inherit;color:inherit}
    #recipe-title{font:600 34px Georgia,serif;letter-spacing:-.03em;margin:0 0 8px;width:100%;border:0;background:transparent;outline:none;padding:0}
    #recipe-subtitle{color:var(--muted);font-size:14px;line-height:1.35;width:100%;border:0;background:transparent;outline:none;padding:0;resize:none}
    .badges{display:flex;gap:8px;margin:15px 0 22px;flex-wrap:wrap}
    .badge{background:var(--accent);color:#240a14;border-radius:999px;padding:6px 10px;font:700 10px ui-monospace,monospace;display:flex;align-items:center;gap:4px}
    .badge input{width:2.4em;border:0;background:transparent;outline:none;font:inherit;color:inherit;text-align:center;padding:0}
    .rule{height:1px;background:var(--line);margin:0 0 22px}
    .columns{display:grid;grid-template-columns:154px 1fr;gap:20px}
    h2{font:700 11px ui-monospace,monospace;color:var(--muted);margin:0 0 10px}
    .ready{color:var(--accent);font:700 12px ui-monospace,monospace;margin-bottom:10px}
    ul,ol{list-style:none;padding:0;margin:0}
    .ingredient{display:grid;grid-template-columns:20px 1fr 14px;gap:7px;align-items:start;padding:5px 0;color:#e2cbd4;font-size:12px}
    .ingredient form{display:contents}
    .check{width:16px;height:16px;border:1px solid var(--muted);border-radius:50%;background:transparent;color:#240a14;padding:0;cursor:pointer}
    .check.on{background:var(--accent);border-color:var(--accent)}
    .check.on:after{content:'✓';font-size:10px;font-weight:900}
    .editable{outline:none;border:0;background:transparent;color:inherit;font:inherit;width:100%;padding:0}
    .remove{opacity:0;border:0;background:none;color:var(--accent);padding:0;cursor:pointer}
    .ingredient:hover .remove,.step:hover .remove{opacity:.7}
    .step{position:relative;margin:0 0 15px}
    .step form{display:contents}
    .step-title{font:600 14px Georgia,serif;margin-right:18px;display:flex;gap:4px;align-items:baseline}
    .step-title input{flex:1;border:0;background:transparent;outline:none;font:inherit;color:inherit;padding:0}
    .step-detail{color:var(--muted);font-size:12px;line-height:1.35;margin-top:4px;width:100%;border:0;background:transparent;outline:none;resize:none;padding:0}
    .step .remove{position:absolute;right:0;top:0}
    .add{border:0;background:none;color:var(--muted);padding:8px 0;font:600 10px ui-monospace,monospace;cursor:pointer}
    .tip{border-top:1px solid var(--line);margin-top:24px;padding-top:17px;color:var(--accent);font:600 14px Georgia,serif;width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;outline:none;resize:none}
    form[aria-busy="true"]{opacity:.55}
    @media print{.add,.remove{display:none}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
  </style>
</head>
<body>
<main>
  <slop-row as="recipe">
    <script type="application/sql">
      SELECT title, subtitle, prep_minutes, cook_minutes, servings FROM recipe
    </script>
    <template>
      <form data-slop-action="update-recipe" data-slop-trigger="change">
        <input id="recipe-title" name="title" value="{{recipe.title}}" autocomplete="off">
        <textarea id="recipe-subtitle" name="subtitle" rows="2">{{recipe.subtitle}}</textarea>
        <div class="badges">
          <label class="badge">Prep <input name="prep_minutes" value="{{recipe.prep_minutes}}" inputmode="numeric"> min</label>
          <label class="badge">Cook <input name="cook_minutes" value="{{recipe.cook_minutes}}" inputmode="numeric"> min</label>
          <label class="badge">Serves <input name="servings" value="{{recipe.servings}}" inputmode="numeric"></label>
        </div>
        <div class="rule"></div>
      </form>
    </template>
  </slop-row>

  <div class="columns">
    <section>
      <h2>Ingredients</h2>
      <slop-row as="summary">
        <script type="application/sql">
          SELECT
            count(*) FILTER (WHERE ready = 1) || ' / ' || count(*) || ' ready' AS ready_label
          FROM ingredients
        </script>
        <template>
          <div class="ready" id="ready-label">{{summary.ready_label}}</div>
        </template>
      </slop-row>
      <ul>
        <slop-each as="ingredient">
          <script type="application/sql">
            SELECT
              id,
              name,
              CASE ready WHEN 1 THEN 'on' ELSE '' END AS ready_class
            FROM ingredients
            ORDER BY position, id
          </script>
          <template>
            <li class="ingredient" id="ingredient-{{ingredient.id}}">
              <form data-slop-action="toggle-ingredient">
                <input type="hidden" name="id" value="{{ingredient.id}}">
                <button class="check {{ingredient.ready_class}}" type="submit" aria-label="Toggle {{ingredient.name}}"></button>
              </form>
              <form data-slop-action="update-ingredient" data-slop-trigger="change">
                <input type="hidden" name="id" value="{{ingredient.id}}">
                <input class="editable" name="name" value="{{ingredient.name}}" autocomplete="off">
              </form>
              <form data-slop-action="remove-ingredient">
                <input type="hidden" name="id" value="{{ingredient.id}}">
                <button class="remove" type="submit" aria-label="Remove {{ingredient.name}}">×</button>
              </form>
            </li>
          </template>
        </slop-each>
      </ul>
      <form data-slop-action="add-ingredient">
        <button class="add" type="submit">+ Add ingredient</button>
      </form>
    </section>

    <section>
      <h2>Steps</h2>
      <ol>
        <slop-each as="step">
          <script type="application/sql">
            SELECT id, title, detail, position FROM steps ORDER BY position, id
          </script>
          <template>
            <li class="step" id="step-{{step.id}}">
              <form data-slop-action="update-step" data-slop-trigger="change">
                <input type="hidden" name="id" value="{{step.id}}">
                <div class="step-title">
                  <span>{{step.position}}.</span>
                  <input name="title" value="{{step.title}}" autocomplete="off">
                </div>
                <textarea class="step-detail" name="detail" rows="2">{{step.detail}}</textarea>
              </form>
              <form data-slop-action="remove-step">
                <input type="hidden" name="id" value="{{step.id}}">
                <button class="remove" type="submit" aria-label="Remove {{step.title}}">×</button>
              </form>
            </li>
          </template>
        </slop-each>
      </ol>
      <form data-slop-action="add-step">
        <button class="add" type="submit">+ Add step</button>
      </form>
    </section>
  </div>

  <slop-row as="recipe">
    <script type="application/sql">
      SELECT tip FROM recipe
    </script>
    <template>
      <form data-slop-action="update-tip" data-slop-trigger="change">
        <textarea class="tip" id="recipe-tip" name="tip" rows="2">{{recipe.tip}}</textarea>
      </form>
    </template>
  </slop-row>
</main>

<script type="application/sql" data-slop-action="update-recipe">
  UPDATE recipe
  SET
    title = trim(:title),
    subtitle = trim(:subtitle),
    prep_minutes = CAST(:prep_minutes AS INTEGER),
    cook_minutes = CAST(:cook_minutes AS INTEGER),
    servings = CAST(:servings AS INTEGER)
  WHERE id = 1
</script>
<script type="application/sql" data-slop-action="update-tip">
  UPDATE recipe SET tip = trim(:tip) WHERE id = 1
</script>
<script type="application/sql" data-slop-action="toggle-ingredient">
  UPDATE ingredients
  SET ready = 1 - ready
  WHERE id = CAST(:id AS INTEGER)
</script>
<script type="application/sql" data-slop-action="update-ingredient">
  UPDATE ingredients
  SET name = trim(:name)
  WHERE id = CAST(:id AS INTEGER)
</script>
<script type="application/sql" data-slop-action="remove-ingredient">
  DELETE FROM ingredients WHERE id = CAST(:id AS INTEGER)
</script>
<script type="application/sql" data-slop-action="add-ingredient">
  INSERT INTO ingredients(name, position)
  VALUES ('New ingredient', COALESCE((SELECT max(position) + 1 FROM ingredients), 1))
</script>
<script type="application/sql" data-slop-action="update-step">
  UPDATE steps
  SET title = trim(:title), detail = trim(:detail)
  WHERE id = CAST(:id AS INTEGER)
</script>
<script type="application/sql" data-slop-action="remove-step">
  DELETE FROM steps WHERE id = CAST(:id AS INTEGER)
</script>
<script type="application/sql" data-slop-action="add-step">
  INSERT INTO steps(title, detail, position)
  VALUES ('New step', 'Add details', COALESCE((SELECT max(position) + 1 FROM steps), 1))
</script>
</body>
</html>
