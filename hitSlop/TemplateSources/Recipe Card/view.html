<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recipe Card</title><script src="/slop.js"></script>
<style>
  :root{color-scheme:dark;--bg:#1c0d14;--panel:#2a111e;--ink:#fff3f7;--muted:#bf8298;--accent:#f45f93;--line:#583044}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:radial-gradient(580px 380px at 100% 0,#421626 0,transparent 62%),var(--bg)}main{padding:30px 24px 34px}h1{font:600 34px Georgia,serif;letter-spacing:-.03em;margin:0 0 8px;outline:none}.subtitle{color:var(--muted);font-size:14px;line-height:1.35;outline:none}
  .badges{display:flex;gap:8px;margin:15px 0 22px}.badge{background:var(--accent);color:#240a14;border-radius:999px;padding:6px 10px;font:700 10px ui-monospace,monospace}.badge span{outline:none}.rule{height:1px;background:var(--line);margin:0 0 22px}.columns{display:grid;grid-template-columns:154px 1fr;gap:20px}h2{font:700 11px ui-monospace,monospace;color:var(--muted);margin:0 0 10px}.ready{color:var(--accent);font:700 12px ui-monospace,monospace;margin-bottom:10px}
  ul,ol{list-style:none;padding:0;margin:0}.ingredient{display:grid;grid-template-columns:20px 1fr 14px;gap:7px;align-items:start;padding:5px 0;color:#e2cbd4;font-size:12px}.check{width:16px;height:16px;border:1px solid var(--muted);border-radius:50%;background:transparent;color:#240a14;padding:0}.check.on{background:var(--accent);border-color:var(--accent)}.check.on:after{content:'✓';font-size:10px;font-weight:900}.editable{outline:none}.remove{opacity:0;border:0;background:none;color:var(--accent);padding:0}.ingredient:hover .remove,.step:hover .remove{opacity:.7}
  .step{position:relative;margin:0 0 15px}.step-title{font:600 14px Georgia,serif;outline:none;margin-right:18px}.step-detail{color:var(--muted);font-size:12px;line-height:1.35;outline:none;margin-top:4px}.step .remove{position:absolute;right:0;top:0}.add{border:0;background:none;color:var(--muted);padding:8px 0;font:600 10px ui-monospace,monospace;cursor:pointer}.tip{border-top:1px solid var(--line);margin-top:24px;padding-top:17px;color:var(--accent);font:600 14px Georgia,serif;outline:none}
  @media print{.add,.remove{display:none}body{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body><main><h1 id="title" contenteditable="true"></h1><div class="subtitle" id="subtitle" contenteditable="true"></div><div class="badges"><div class="badge">Prep <span id="prep" contenteditable="true"></span> min</div><div class="badge">Cook <span id="cook" contenteditable="true"></span> min</div><div class="badge">Serves <span id="servings" contenteditable="true"></span></div></div><div class="rule"></div><div class="columns"><section><h2>Ingredients</h2><div class="ready" id="ready"></div><ul id="ingredients"></ul><button class="add" id="addIngredient">+ Add ingredient</button></section><section><h2>Steps</h2><ol id="steps"></ol><button class="add" id="addStep">+ Add step</button></section></div><div class="tip" id="tip" contenteditable="true"></div></main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let recipe;
async function load(){const [r,ingredients,steps]=await Promise.all([slop.query('SELECT * FROM recipe WHERE id=1'),slop.query('SELECT * FROM ingredients ORDER BY position,id'),slop.query('SELECT * FROM steps ORDER BY position,id')]);recipe=r[0];render(recipe,ingredients,steps)}
function render(r,ingredients,steps){for(const key of ['title','subtitle','prep_minutes','cook_minutes','servings','tip']){const id={prep_minutes:'prep',cook_minutes:'cook'}[key]||key;document.querySelector('#'+id).textContent=r[key]}
 const done=ingredients.filter(x=>Number(x.ready)).length;document.querySelector('#ready').textContent=`${done} / ${ingredients.length} ready`;
 document.querySelector('#ingredients').innerHTML=ingredients.map(x=>`<li class="ingredient"><button class="check ${Number(x.ready)?'on':''}" data-check="${x.id}" data-value="${x.ready}"></button><span class="editable" contenteditable="true" data-ingredient="${x.id}">${esc(x.name)}</span><button class="remove" data-remove-ingredient="${x.id}">×</button></li>`).join('');
 document.querySelector('#steps').innerHTML=steps.map((x,i)=>`<li class="step"><div class="step-title"><span>${i+1}. </span><span contenteditable="true" data-step-title="${x.id}">${esc(x.title)}</span></div><div class="step-detail" contenteditable="true" data-step-detail="${x.id}">${esc(x.detail)}</div><button class="remove" data-remove-step="${x.id}">×</button></li>`).join('')}
const fields={title:'title',subtitle:'subtitle',prep:'prep_minutes',cook:'cook_minutes',servings:'servings',tip:'tip'};for(const [id,column] of Object.entries(fields)){document.querySelector('#'+id).addEventListener('blur',async e=>{let value=e.target.textContent.trim();if(['prep_minutes','cook_minutes','servings'].includes(column))value=Math.max(column==='servings'?1:0,Number(value)||0);await slop.exec(`UPDATE recipe SET ${column}=? WHERE id=1`,[value]);await load()})}
document.querySelector('#ingredients').addEventListener('click',async e=>{const c=e.target.closest('[data-check]');if(c){await slop.exec('UPDATE ingredients SET ready=? WHERE id=?',[Number(c.dataset.value)?0:1,Number(c.dataset.check)]);await load()}const r=e.target.closest('[data-remove-ingredient]');if(r){await slop.exec('DELETE FROM ingredients WHERE id=?',[Number(r.dataset.removeIngredient)]);await load()}});
document.querySelector('#ingredients').addEventListener('focusout',async e=>{if(e.target.dataset.ingredient){await slop.exec('UPDATE ingredients SET name=? WHERE id=?',[e.target.textContent.trim()||'Ingredient',Number(e.target.dataset.ingredient)]);await load()}});
document.querySelector('#steps').addEventListener('click',async e=>{const r=e.target.closest('[data-remove-step]');if(r){await slop.exec('DELETE FROM steps WHERE id=?',[Number(r.dataset.removeStep)]);await load()}});document.querySelector('#steps').addEventListener('focusout',async e=>{if(e.target.dataset.stepTitle){await slop.exec('UPDATE steps SET title=? WHERE id=?',[e.target.textContent.trim()||'Step',Number(e.target.dataset.stepTitle)]);await load()}if(e.target.dataset.stepDetail){await slop.exec('UPDATE steps SET detail=? WHERE id=?',[e.target.textContent.trim(),Number(e.target.dataset.stepDetail)]);await load()}});
document.querySelector('#addIngredient').onclick=async()=>{await slop.exec("INSERT INTO ingredients(name,position) VALUES('New ingredient',COALESCE((SELECT max(position)+1 FROM ingredients),1))");await load()};document.querySelector('#addStep').onclick=async()=>{await slop.exec("INSERT INTO steps(title,detail,position) VALUES('New step','Add details',COALESCE((SELECT max(position)+1 FROM steps),1))");await load()};slop.onChange(()=>load());load().then(()=>slop.ready());
</script></body></html>
