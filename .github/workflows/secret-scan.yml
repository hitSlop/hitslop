name: Secret scan

on:
  pull_request:
  push:
    branches: [main, v2]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full-history Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
