name: macOS client and Loro runtime
on:
  pull_request:
  push:
    branches: [master, refactor]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun install --cwd apps/landing --frozen-lockfile
      - run: brew install xcodegen
      - run: bun run test:local
