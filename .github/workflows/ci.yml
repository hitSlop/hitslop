name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        run: |
          swift test --package-path packages/apple
          swift test --package-path apps/macos/packages/HitSlopHost
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate and verify macOS app contents
        working-directory: apps/macos/hitSlop
        run: |
          xcodegen generate
          derived="$RUNNER_TEMP/hitslop-macos-derived"
          xcodebuild \
            -project hitSlop.xcodeproj \
            -scheme hitSlop \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
          debug_app="$derived/Build/Products/Debug/hitSlop.app"
          test ! -e "$debug_app/Contents/PlugIns/SlopThumbnail.appex"
          xcodebuild \
            -project hitSlop.xcodeproj \
            -scheme hitSlop \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$derived" \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=YES \
            build
          release_plugins="$derived/Build/Products/Release/hitSlop.app/Contents/PlugIns"
          test ! -e "$release_plugins/SlopThumbnail.appex"
      - name: Generate and build iOS simulator
        working-directory: apps/ios/hitSlop
        run: |
          xcodegen generate
          xcodebuild \
            -project hitSlop.xcodeproj \
            -scheme hitSlop \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
