name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        run: |
          swift test --package-path apps/macos/packages/HitSlopCore
          swift test --package-path apps/macos/packages/HitSlopHost
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate and build unsigned Debug
        working-directory: apps/macos/hitSlop
        run: |
          xcodegen generate
          xcodebuild \
            -project hitSlop.xcodeproj \
            -scheme hitSlop \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
