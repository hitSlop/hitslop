name: macOS client and Loro runtime
on:
  pull_request:
  push:
    branches: [master, refactor]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run check
      - run: bun run swift:build
      - run: bun run test
      - run: bun run swift:test
      - run: bun run test:native-helper
      - run: bun run test:storage
      - run: bun run packages:pack
      - run: bun run test:packed
      - run: brew install xcodegen
      - run: bun run apple:build
      - run: bun run test:native-crash
