name: macOS client and Loro runtime
on:
  pull_request:
  push:
    branches: [master, refactor]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun install --cwd apps/landing --frozen-lockfile
      - run: brew install xcodegen
      - run: bun run hygiene
      - name: Restore template cache
        uses: actions/cache/restore@v6
        with:
          path: .hitslop/template-cache
          key: templates-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: templates-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build runtime, helper, and templates
        id: templates
        run: bun run build
        env:
          HITSLOP_TEMPLATE_CACHE_DIR: .hitslop/template-cache
      - name: Save completed template cache
        uses: actions/cache/save@v6
        with:
          path: .hitslop/template-cache
          key: templates-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate built artifacts
        run: bun run test:built
