name: Nx full-corpus evaluation
on:
  workflow_dispatch:
  # Bootstrap the evaluation; repeat fresh-runner samples at this same SHA.
  push:
    branches: [experiment/nx-pilot]
    paths: [.github/workflows/nx-pilot.yml]
permissions:
  contents: read
concurrency:
  group: nx-pilot
  cancel-in-progress: false
env:
  NX_DAEMON: "false"
  NX_ISOLATE_PLUGINS: "false"
  NX_TUI: "false"
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
jobs:
  portable:
    if: github.repository == 'hitSlop/hitslop' && (github.ref == 'refs/heads/experiment/nx-pilot' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - name: Require trusted CI cache credentials
        run: test -n "$NX_CLOUD_ACCESS_TOKEN"
      - run: bun scripts/v1/ci-baseline.ts
      - run: bun node_modules/typescript/bin/tsc -p scripts/nx-pilot/tsconfig.json
      - name: Direct portable baseline
        run: bun scripts/nx-pilot/measure.ts direct-portable bun scripts/nx-pilot/direct.ts --portable
      - run: bun scripts/nx-pilot/fingerprints.ts linux-direct
      - run: bun scripts/nx-pilot/clean.ts --cache
      - name: Fresh runner remote portable build
        run: bun scripts/nx-pilot/measure.ts remote-portable bun scripts/nx-pilot/run.ts --portable
      - run: bun scripts/nx-pilot/fingerprints.ts linux-nx .hitslop/v1-evidence/nx-pilot/linux-direct-bytes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nx-pilot-portable-${{ github.run_attempt }}
          path: .hitslop/v1-evidence/nx-pilot
          include-hidden-files: true
  portable-correctness:
    needs: portable
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NX_NO_CLOUD: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun scripts/v1/ci-baseline.ts
      - run: bun scripts/nx-pilot/evaluate.ts --portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nx-pilot-correctness-${{ github.run_attempt }}
          path: .hitslop/v1-evidence/nx-pilot
          include-hidden-files: true
  artwork:
    needs: portable
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun scripts/v1/ci-baseline.ts
      - name: Identify Swift toolchain
        id: toolchain
        run: |
          TOOLCHAIN_HASH=$( (xcodebuild -version; swift --version) | shasum -a 256 | cut -d ' ' -f 1)
          echo "hash=$TOOLCHAIN_HASH" >> "$GITHUB_OUTPUT"
      # Preserve the existing SwiftPM cache. Never transport an Nx local cache between runners.
      - uses: actions/cache@v6
        with:
          path: apps/apple/Packages/HitSlopApple/.build
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('apps/apple/Packages/HitSlopApple/Package.resolved', 'apps/apple/Packages/HitSlopApple/Package.swift') }}-${{ hashFiles('apps/apple/Packages/HitSlopApple/Sources/**', 'apps/apple/Packages/HitSlopApple/Tests/**', 'packages/document/**', 'packages/schema/**', 'runtimes/**', 'bun.lock') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('apps/apple/Packages/HitSlopApple/Package.resolved', 'apps/apple/Packages/HitSlopApple/Package.swift') }}-
      - name: Prepare matching native helper
        run: |
          bun scripts/nx-pilot/measure.ts native-setup bun run build
          echo "HITSLOP_NATIVE_CLI=$GITHUB_WORKSPACE/apps/apple/Packages/HitSlopApple/.build/debug/hitslop-native" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: nx-pilot-portable-${{ github.run_attempt }}
          path: .hitslop/v1-evidence/linux
      - name: Restore existing template cache (isolated benchmark namespace)
        id: legacy-cache
        uses: actions/cache/restore@v6
        with:
          path: generated/nx-pilot/legacy-cache
          key: nx-eval-legacy-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ github.run_id }}-${{ github.run_attempt }}
          # The production cache validates every source/toolchain input itself.
          # Reuse a prior benchmark revision when only the harness has changed.
          restore-keys: |
            nx-eval-legacy-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-
            nx-eval-legacy-
      - name: Existing builder with restored cache
        run: |
          bun scripts/nx-pilot/measure.ts legacy-full bun scripts/nx-pilot/legacy.ts
          cp .hitslop/v1-evidence/template-cache-templates.json .hitslop/v1-evidence/nx-pilot/legacy-full-cache.json
          bun scripts/nx-pilot/fingerprints.ts legacy-full .hitslop/v1-evidence/linux/linux-direct-bytes.json
      - name: Save existing template cache
        uses: actions/cache/save@v6
        with:
          path: generated/nx-pilot/legacy-cache
          key: ${{ steps.legacy-cache.outputs.cache-primary-key }}
      - name: Direct full baseline
        if: github.run_attempt == 1
        run: |
          bun scripts/nx-pilot/measure.ts direct-full bun scripts/nx-pilot/direct.ts
          bun scripts/nx-pilot/fingerprints.ts mac-direct .hitslop/v1-evidence/linux/linux-direct-bytes.json
      - run: bun scripts/nx-pilot/clean.ts --cache
      - name: Fresh runner remote full build
        run: |
          bun scripts/nx-pilot/measure.ts remote-full bun run nx:pilot
          bun scripts/nx-pilot/fingerprints.ts mac-nx .hitslop/v1-evidence/linux/linux-direct-bytes.json
      - name: Local warm build
        run: bun scripts/nx-pilot/measure.ts local-warm bun run nx:pilot
      - name: Previously unseen single-slop edit
        run: bun scripts/nx-pilot/edit-benchmark.ts
      - name: Native cache correctness and cloud-disabled fallback
        if: github.run_attempt == 1
        env:
          NX_NO_CLOUD: "true"
        run: bun scripts/nx-pilot/evaluate.ts --slugs=daily-planner,reading-tracker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nx-pilot-macos-${{ github.run_attempt }}
          path: .hitslop/v1-evidence/nx-pilot
          include-hidden-files: true
