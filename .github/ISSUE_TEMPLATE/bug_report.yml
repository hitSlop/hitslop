name: Bug report
description: Report a reproducible problem in hitSlop
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve hitSlop. Do not include secrets or private documents.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - macOS or iOS app
        - Authoring CLI
        - Svelte SDK
        - React SDK
        - Catalog or registry
        - A bundled example
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behavior and a minimal reproduction.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      placeholder: hitSlop version, macOS/iOS version, Bun version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
