name: hitSlop
options:
  bundleIdPrefix: com.hitslop
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "12"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 78UAXU8QG8
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  HitSlopCore:
    path: ../packages/HitSlopCore
  HitSlopHost:
    path: ../packages/HitSlopHost
targets:
  hitSlop:
    type: application
    platform: macOS
    sources:
      - path: hitSlop
    dependencies:
      - package: HitSlopHost
        product: HitSlopHost
      - package: HitSlopHost
        product: HitSlopCatalog
      - target: SlopPreview
        embed: true
      - target: SlopThumbnail
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app
        PRODUCT_NAME: hitSlop
        INFOPLIST_FILE: hitSlop/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: hitSlop/hitSlop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: NO
      configs:
        Debug:
          HITSLOP_CATALOG_URL: http://localhost:3000
          HITSLOP_CONVEX_URL: https://giddy-opossum-593.convex.cloud
        Release:
          HITSLOP_CATALOG_URL: https://hitslop.app
          HITSLOP_CONVEX_URL: https://fastidious-malamute-777.convex.cloud
  SlopPreview:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/Preview
    dependencies:
      - sdk: QuickLookUI.framework
    settings:
      base:
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app.preview
        PRODUCT_NAME: SlopPreview
        INFOPLIST_FILE: Extensions/Preview/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/SlopExtension.entitlements
        SKIP_INSTALL: YES
  SlopThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Extensions/Thumbnail
    dependencies:
      - sdk: QuickLookThumbnailing.framework
    settings:
      base:
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_HARDENED_RUNTIME: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app.thumbnail
        PRODUCT_NAME: SlopThumbnail
        INFOPLIST_FILE: Extensions/Thumbnail/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/SlopExtension.entitlements
        SKIP_INSTALL: YES
schemes:
  hitSlop:
    build:
      targets:
        hitSlop: all
        SlopPreview: all
        SlopThumbnail: all
    run:
      config: Debug
      executable: hitSlop
    profile:
      config: Release
      executable: hitSlop
