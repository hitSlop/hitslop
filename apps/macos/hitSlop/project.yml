name: hitSlop
options:
  bundleIdPrefix: com.hitslop
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "18"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 78UAXU8QG8
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  HitSlopHost:
    path: ../packages/HitSlopHost
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.6
targets:
  hitSlop:
    type: application
    platform: macOS
    sources:
      - path: hitSlop
    dependencies:
      - package: HitSlopHost
        product: HitSlopHost
      - package: HitSlopHost
        product: HitSlopCatalog
      - package: Sparkle
        product: Sparkle
    postCompileScripts:
      - name: Embed hitslop-native
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          case "${CONFIGURATION:-}" in
            Release) ;;
            *) exit 0 ;;
          esac
          export HITSLOP_NATIVE_ARCHS="${ARCHS:-}"
          "${SRCROOT}/../../../scripts/embed-hitslop-native.sh" "${TARGET_BUILD_DIR}/${WRAPPER_NAME}"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.app
        PRODUCT_NAME: hitSlop
        INFOPLIST_FILE: hitSlop/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: hitSlop/hitSlop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: NO
      configs:
        Debug:
          HITSLOP_CATALOG_URL: http://localhost:3000
          HITSLOP_CONVEX_URL: https://giddy-opossum-593.convex.cloud
        Release:
          HITSLOP_CATALOG_URL: https://hitslop.app
          HITSLOP_CONVEX_URL: https://fastidious-malamute-777.convex.cloud
schemes:
  hitSlop:
    build:
      targets:
        hitSlop: all
    run:
      config: Debug
      executable: hitSlop
    profile:
      config: Release
      executable: hitSlop
