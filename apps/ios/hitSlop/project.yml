name: hitSlop
options:
  bundleIdPrefix: com.hitslop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 78UAXU8QG8
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  HitSlopCore:
    path: ../../macos/packages/HitSlopCore
  HitSlopRuntime:
    path: ../../macos/packages/HitSlopRuntime
  HitSlopRegistry:
    path: ../../macos/packages/HitSlopRegistry
targets:
  hitSlop:
    type: application
    platform: iOS
    sources:
      - path: hitSlop
    dependencies:
      - package: HitSlopCore
        product: HitSlopCore
      - package: HitSlopRuntime
        product: HitSlopRuntime
      - package: HitSlopRegistry
        product: HitSlopRegistry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hitslop.ios
        PRODUCT_NAME: hitSlop
        INFOPLIST_FILE: hitSlop/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: hitSlop/hitSlop.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
      configs:
        Debug:
          HITSLOP_CATALOG_URL: https://hitslop.app
          HITSLOP_CONVEX_URL: https://fastidious-malamute-777.convex.cloud
        Release:
          HITSLOP_CATALOG_URL: https://hitslop.app
          HITSLOP_CONVEX_URL: https://fastidious-malamute-777.convex.cloud
schemes:
  hitSlop:
    build:
      targets:
        hitSlop: all
    run:
      config: Debug
      executable: hitSlop
