<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Silo Wall</title>
  <script src="/slop.js"></script>
  <style>
    :root {
      --paper: #efe4d0;
      --paper-2: #e6d7bc;
      --ink: #2a1c12;
      --ink-soft: #6a4e3a;
      --rule: #c9b394;
      --oxblood: #7a2e22;
      --moss: #3f5a3a;
      --pencil: #8a7460;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      color: var(--ink);
      background:
        radial-gradient(1200px 400px at 20% -10%, #f6ecda 0%, transparent 50%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 27px,
          rgb(42 28 18 / 0.04) 28px
        ),
        var(--paper);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif;
    }
    .page {
      padding: 18px 22px 28px;
      max-width: 420px;
      margin: 0 auto;
    }
    header.running {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: "Avenir Next Condensed", "Helvetica Neue", sans-serif;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 11px;
      color: var(--ink-soft);
      border-bottom: 1px solid var(--ink);
      padding-bottom: 6px;
    }
    h1 {
      font-weight: 400;
      font-size: 38px;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin: 14px 0 4px;
    }
    .place {
      font-style: italic;
      color: var(--ink-soft);
      margin: 0 0 14px;
      font-size: 14px;
    }
    .lede {
      font-size: 14.5px;
      line-height: 1.45;
      color: var(--ink);
      margin: 0 0 18px;
      max-width: 34ch;
    }
    .stats {
      display: flex;
      gap: 18px;
      margin-bottom: 16px;
      font-family: "Avenir Next Condensed", "Helvetica Neue", sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 11px;
      color: var(--ink-soft);
    }
    .stats b {
      color: var(--oxblood);
      font-size: 18px;
      letter-spacing: 0;
      font-weight: 600;
      display: block;
      font-family: "Iowan Old Style", Palatino, serif;
      text-transform: none;
    }
    .wall {
      font-family: "Avenir Next Condensed", sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--pencil);
      margin: 16px 0 6px;
    }
    ul.routes { list-style: none; margin: 0; padding: 0; }
    .route {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px dotted var(--rule);
    }
    button.ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid var(--ink);
      background: transparent;
      padding: 0;
      cursor: pointer;
      color: var(--ink);
      display: grid;
      place-items: center;
      font-size: 14px;
      line-height: 1;
    }
    button.ring:hover { background: rgb(42 28 18 / 0.06); }
    button.ring:focus-visible { outline: 2px solid var(--oxblood); outline-offset: 2px; }
    button.ring[data-status="attempted"] {
      background:
        linear-gradient(135deg, transparent 46%, var(--ink) 46%, var(--ink) 54%, transparent 54%);
    }
    button.ring[data-status="sent"] {
      background: var(--oxblood);
      border-color: var(--oxblood);
      color: var(--paper);
    }
    button.ring[data-status="sent"]::after { content: ""; }
    .name {
      font-size: 16px;
      line-height: 1.2;
    }
    .name.sent { font-style: italic; }
    .grade {
      font-family: "Avenir Next Condensed", "Helvetica Neue", sans-serif;
      font-weight: 600;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      color: var(--ink);
    }
    h2 {
      font-size: 13px;
      font-family: "Avenir Next Condensed", sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--ink-soft);
      margin: 22px 0 8px;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 4px;
    }
    .log { margin: 0; padding: 0; list-style: none; }
    .log li {
      display: grid;
      grid-template-columns: 64px 1fr auto;
      gap: 8px;
      font-size: 13px;
      padding: 4px 0;
      color: var(--ink-soft);
    }
    .log .when {
      font-family: "Avenir Next Condensed", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .log .verb {
      color: var(--oxblood);
      font-variant: small-caps;
      letter-spacing: 0.04em;
    }
    form.add {
      display: grid;
      grid-template-columns: 1fr 72px 40px;
      gap: 8px;
      margin-top: 8px;
    }
    form.add input, form.add button {
      font: inherit;
      font-size: 14px;
      border: 0;
      border-bottom: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      padding: 8px 0;
      border-radius: 0;
    }
    form.add input:focus { outline: none; border-bottom-color: var(--oxblood); }
    form.add button {
      cursor: pointer;
      font-family: "Avenir Next Condensed", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 12px;
    }
    form.add button:hover { color: var(--oxblood); }
    .err {
      color: var(--oxblood);
      font-size: 13px;
      min-height: 1.2em;
      margin: 8px 0 0;
    }
    footer {
      margin-top: 28px;
      font-size: 11px;
      color: var(--pencil);
      font-family: "Avenir Next Condensed", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="running">
      <span>Silo Wall · Tick List</span>
      <span id="running-count"></span>
    </header>
    <h1>Silo Wall</h1>
    <p class="place">New River Gorge · West Virginia</p>
    <p class="lede">The arete catches evening light. Chalk ghosts last a week on this sandstone. Tick a ring: open, one hang, sent.</p>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
    <h2>Field notes</h2>
    <ul class="log" id="log"></ul>
    <h2>Pencil a line</h2>
    <form class="add" id="add">
      <input name="name" required placeholder="Route name" autocomplete="off">
      <input name="grade" required placeholder="5.11a" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <p class="err" id="err"></p>
    <footer>This page is a SQLite file. Your ticks commit here.</footer>
  </div>
  <script>
    const nextStatus = { open: "attempted", attempted: "sent", sent: "open" };
    const nextVerb = { open: "attempt", attempted: "send", sent: "open" };

    const $ = (id) => document.getElementById(id);
    const err = (msg) => { $("err").textContent = msg || ""; };

    function when(iso) {
      const d = new Date(iso.replace(" ", "T"));
      if (Number.isNaN(d.getTime())) return iso.slice(5, 16);
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${hh}:${mm}`;
    }

    function renderStats(s) {
      $("running-count").textContent = `${s.sent} sent / ${s.routes}`;
      $("stats").innerHTML = `
        <div><b>${s.sent}</b> sent</div>
        <div><b>${s.attempted}</b> hanging</div>
        <div><b>${s.ticks}</b> ticks</div>`;
    }

    function renderRoutes(routes) {
      const walls = [];
      for (const r of routes) {
        if (!walls.includes(r.wall)) walls.push(r.wall);
      }
      $("list").innerHTML = walls.map((wall) => {
        const rows = routes.filter((r) => r.wall === wall).map((r) => `
          <li class="route">
            <button class="ring" data-id="${r.id}" data-status="${r.status}"
              aria-label="${r.name}, ${r.status}" title="cycle: open → attempt → send"></button>
            <span class="name ${r.status}">${escapeHtml(r.name)}</span>
            <span class="grade">${escapeHtml(r.grade)}</span>
          </li>`).join("");
        return `<div class="wall">${escapeHtml(wall)}</div><ul class="routes">${rows}</ul>`;
      }).join("");
    }

    function renderLog(rows) {
      $("log").innerHTML = rows.map((r) => `
        <li>
          <span class="when">${escapeHtml(when(r.at))}</span>
          <span>${escapeHtml(r.name)}</span>
          <span class="verb">${escapeHtml(r.verb)}</span>
        </li>`).join("") || `<li><span class="when"></span><span>Nothing this session.</span></li>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }

    async function load() {
      const [routes, stats, log] = await Promise.all([
        slop.query("SELECT id, name, grade, wall, status FROM routes ORDER BY sort, id"),
        slop.query("SELECT * FROM stats"),
        slop.query(`
          SELECT l.at, l.verb, r.name
          FROM log l JOIN routes r ON r.id = l.route_id
          ORDER BY l.at DESC LIMIT 8
        `),
      ]);
      renderStats(stats[0] || { routes: 0, sent: 0, attempted: 0, ticks: 0 });
      renderRoutes(routes);
      renderLog(log);
    }

    $("list").addEventListener("click", async (ev) => {
      const btn = ev.target.closest("button.ring");
      if (!btn) return;
      const id = Number(btn.dataset.id);
      const status = btn.dataset.status;
      const next = nextStatus[status];
      const verb = nextVerb[status];
      err("");
      try {
        await slop.exec("UPDATE routes SET status = ? WHERE id = ?", [next, id]);
        await slop.exec("INSERT INTO log (route_id, verb) VALUES (?, ?)", [id, verb]);
        await load();
      } catch (e) {
        err(e.message);
      }
    });

    $("add").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const name = String(fd.get("name") || "").trim();
      const grade = String(fd.get("grade") || "").trim();
      if (!name || !grade) return;
      err("");
      try {
        const max = await slop.query("SELECT COALESCE(MAX(sort), 0) AS m FROM routes");
        await slop.exec(
          "INSERT INTO routes (name, grade, wall, status, sort) VALUES (?, ?, 'Main Face', 'open', ?)",
          [name, grade, Number(max[0].m) + 1],
        );
        ev.target.reset();
        await load();
      } catch (e) {
        err(e.message);
      }
    });

    slop.onChange(() => load());
    load().catch((e) => err(e.message));
  </script>
</body>
</html>
